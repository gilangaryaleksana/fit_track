name: health_tracker
description: Aplikasi tracking kesehatan dan olahraga
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  path: ^1.8.3
  intl: ^0.19.0
  fl_chart: ^0.68.0
  geolocator: ^13.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  flutter_foreground_task: ^8.13.0
  permission_handler: ^11.3.0
  connectivity_plus: ^6.1.0
  flutter_local_notifications: ^17.2.4
  http: ^1.2.0
  image_picker: ^1.1.2
  package_info_plus: ^8.0.2
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  shared_preferences: ^2.2.0
  light: '>=3.0.1'
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
